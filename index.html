<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Try on · TCM Cordovan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;color:#fff;font:16px/1.5 Jost,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{position:fixed;inset:0}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage video{transform:scaleX(-1)}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 14px) 18px 14px;text-align:center;font:700 22px "Times New Roman",Georgia,serif;letter-spacing:.02em;background:linear-gradient(#0008,#0000);pointer-events:none}
.status{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translateX(-50%);background:#000a;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 16px;border-radius:999px;font-size:14px;white-space:nowrap;transition:opacity .3s}
.status[hidden]{display:block;opacity:0;pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;padding:16px 20px calc(env(safe-area-inset-bottom) + 18px);background:linear-gradient(#0000,#000c 45%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.name{font-size:14px;text-transform:uppercase;letter-spacing:.02em;line-height:1.3}.name span{display:block;opacity:.75;text-transform:none}
.shutter{width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff3;cursor:pointer;padding:0}
.shutter:active{background:#fff8}
.ghost{justify-self:end;font:inherit;font-size:14px;color:#fff;background:#0006;border:1px solid #fff5;border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
.panel{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 116px);max-width:420px;margin:0 auto;background:#111e;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;padding:16px 18px;display:grid;gap:10px}
.panel[hidden]{display:none}
.panel label{display:grid;grid-template-columns:72px 1fr;align-items:center;font-size:14px;gap:12px}
.panel input{width:100%;accent-color:#fff;height:32px}
.panel .reset{justify-self:start;font:inherit;font-size:14px;color:#fff;background:none;border:0;text-decoration:underline;min-height:40px;cursor:pointer}
.intro{position:fixed;inset:0;background:#fff;color:#111;display:grid;place-items:center;padding:calc(env(safe-area-inset-top) + 24px) 28px calc(env(safe-area-inset-bottom) + 24px);text-align:center}
.intro[hidden]{display:none}
.intro .mark{font:700 26px "Times New Roman",Georgia,serif;margin-bottom:28px}
.intro h1{font-weight:500;font-size:clamp(28px,7vw,44px);line-height:1.05;text-transform:uppercase;text-wrap:balance;margin-bottom:14px}
.intro p{color:#555;max-width:34ch;margin:0 auto 26px}
.intro .go{font:inherit;font-size:16px;color:#fff;background:#111;border:0;min-height:54px;padding:0 34px;cursor:pointer;width:min(320px,100%)}
.intro small{display:block;color:#777;font-size:13px;margin-top:16px;max-width:36ch;margin-inline:auto}
.intro .err{color:#a11;margin-top:16px;font-size:14px;max-width:36ch;margin-inline:auto}
.shot{position:fixed;inset:0;background:#000;display:grid;grid-template-rows:1fr auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);gap:14px}
.shot[hidden]{display:none}
.shot img{width:100%;height:100%;object-fit:contain;min-height:0}
.shot .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.shot .acts button,.shot .acts a{font:inherit;font-size:15px;color:#111;background:#fff;border:0;min-height:48px;padding:0 24px;display:inline-flex;align-items:center;text-decoration:none;cursor:pointer}
.shot .acts .sec{background:transparent;color:#fff;border:1px solid #fff6}
@media(prefers-reduced-motion:reduce){.status{transition:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
</head>
<body>
<div class="stage"><video id="video" playsinline muted></video><canvas id="gl"></canvas></div>
<div class="top">TCM</div>
<div class="status" id="status" hidden></div>
<div class="bar">
  <div class="name">TCM Cordovan<span>189.00 SR</span></div>
  <button class="shutter" id="snap" aria-label="Take a photo"></button>
  <button class="ghost" id="fitBtn" aria-expanded="false">Adjust fit</button>
</div>
<div class="panel" id="panel" hidden>
  <label>Size<input id="f-size" type="range" min="0.85" max="1.15" step="0.01" value="1"></label>
  <label>Height<input id="f-height" type="range" min="-8" max="8" step="0.5" value="0"></label>
  <label>Depth<input id="f-depth" type="range" min="-10" max="10" step="0.5" value="0"></label>
  <button class="reset" id="f-reset">Reset fit</button>
</div>
<div class="intro" id="intro">
  <div>
    <div class="mark">TCM</div>
    <h1>Try on the Cordovan</h1>
    <p>See the frame on your face, live. Turn your head to check the side profile.</p>
    <button class="go" id="start">Start camera</button>
    <small>Runs entirely on your phone. Your camera feed is never uploaded or recorded.</small>
    <div class="err" id="err" role="alert"></div>
  </div>
</div>
<div class="shot" id="shot" hidden>
  <img id="shotImg" alt="Your try-on photo">
  <div class="acts"><button id="share">Share</button><a id="save" download="tcm-cordovan-tryon.jpg">Save</a><button class="sec" id="close">Back to camera</button></div>
</div>
<script type="module">
import * as THREE from 'three';
import { FaceLandmarker, FilesetResolver } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs';
import { loadGlasses, buildOccluder, makeEnvironment } from './glasses.js';
{
  const WASM = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm';
  const MODEL = 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task';
  const EYE_MM = 90;                 // average outer eye-corner distance, sets true size
  const ANCHOR = { y: 1.5, z: -10 }; // nose-bridge landmark in frame coordinates (mm)

  const $ = id => document.getElementById(id);
  const video = $('video'), canvas = $('gl'), statusEl = $('status');
  const say = t => { statusEl.textContent = t || ''; statusEl.hidden = !t; };

  // ---------- fit settings (remembered on this device) ----------
  const fit = { size: 1, height: 0, depth: 0 };
  try { Object.assign(fit, JSON.parse(localStorage.getItem('tcm-fit') || '{}')); } catch {}
  const bindFit = k => {
    const el = $('f-' + k); el.value = fit[k];
    el.addEventListener('input', () => { fit[k] = +el.value; try { localStorage.setItem('tcm-fit', JSON.stringify(fit)); } catch {} });
  };
  ['size', 'height', 'depth'].forEach(bindFit);
  $('f-reset').addEventListener('click', () => {
    Object.assign(fit, { size: 1, height: 0, depth: 0 });
    ['size', 'height', 'depth'].forEach(k => $('f-' + k).value = fit[k]);
    try { localStorage.removeItem('tcm-fit'); } catch {}
  });
  $('fitBtn').addEventListener('click', e => {
    const open = $('panel').hidden; $('panel').hidden = !open; e.currentTarget.setAttribute('aria-expanded', open);
  });

  // ---------- three.js ----------
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  const scene = new THREE.Scene();
  scene.environment = makeEnvironment(renderer);
  const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(0.3, 1, 1); scene.add(sun);
  const camera = new THREE.OrthographicCamera(0, 1, 0, -1, -20000, 20000);
  const rig = new THREE.Group(); rig.visible = false; scene.add(rig);
  const glasses = await loadGlasses(); rig.add(glasses); rig.add(buildOccluder());
  let W = 0, H = 0;
  function sizeTo(w, h) {
    W = w; H = h; renderer.setSize(w, h, false);
    Object.assign(camera, { left: 0, right: w, top: 0, bottom: -h }); camera.updateProjectionMatrix();
  }

  // ---------- smoothing (One Euro filter) ----------
  class OneEuro {
    constructor(minCut = 1.4, beta = 0.006, dCut = 1) { Object.assign(this, { minCut, beta, dCut, x: null, dx: 0 }); }
    a(cut, dt) { const r = 2 * Math.PI * cut * dt; return r / (r + 1); }
    f(v, dt) {
      if (this.x === null) { this.x = v; return v; }
      const d = (v - this.x) / dt; this.dx += this.a(this.dCut, dt) * (d - this.dx);
      const cut = this.minCut + this.beta * Math.abs(this.dx);
      this.x += this.a(cut, dt) * (v - this.x); return this.x;
    }
    reset() { this.x = null; this.dx = 0; }
  }
  // position: steady at rest (1 Hz), opens up quickly when the head moves (beta is per px/s)
  const fp = [new OneEuro(1.0, 0.02), new OneEuro(1.0, 0.02), new OneEuro(1.0, 0.02)];
  const fs = new OneEuro(0.4, 0.8);  // size barely changes; keep it very calm
  const qS = new THREE.Quaternion(); let haveQ = false;

  // ---------- pose ----------
  const P = (L, i, out) => out.set((1 - L[i].x) * W, -L[i].y * H, -L[i].z * W);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), t = new THREE.Vector3(), c = new THREE.Vector3(), n = new THREE.Vector3();
  const xA = new THREE.Vector3(), yA = new THREE.Vector3(), zA = new THREE.Vector3(), off = new THREE.Vector3();
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), mirror = new THREE.Matrix4().makeScale(-1, 1, 1);
  const tmpP = new THREE.Vector3(), tmpS = new THREE.Vector3();
  // Head rotation. Preferred: MediaPipe's facial transformation matrix (rigid fit over all 468
  // points, unaffected by talking/jaw). It lives in un-mirrored camera space, so mirror it: S·M·S.
  // Fallback: basis from 4 landmarks (noisier: chin moves with the mouth).
  function headRotation(res, L, out) {
    const fm = res.facialTransformationMatrixes && res.facialTransformationMatrixes[0];
    if (fm && fm.data && fm.data.length === 16) {
      m.fromArray(fm.data).premultiply(mirror).multiply(mirror).decompose(tmpP, out, tmpS);
      return;
    }
    P(L, 10, t); P(L, 152, c);
    yA.subVectors(t, c); yA.addScaledVector(xA, -yA.dot(xA)).normalize();
    zA.crossVectors(xA, yA);
    out.setFromRotationMatrix(m.makeBasis(xA, yA, zA));
  }
  function place(res, L, dt) {
    P(L, 33, a); P(L, 263, b); P(L, 6, n);
    xA.subVectors(a, b); const eye = xA.length(); xA.normalize();
    headRotation(res, L, q);
    if (!haveQ) { qS.copy(q); haveQ = true; }
    else {
      // One-Euro-style slerp: tiny jitter is heavily damped, real turns follow quickly
      const speed = qS.angleTo(q) / dt, r = 2 * Math.PI * (1.2 + 2.0 * speed) * dt;
      qS.slerp(q, r / (r + 1));
    }
    const s = fs.f(eye / EYE_MM * fit.size, dt);
    off.set(0, ANCHOR.y + fit.height, ANCHOR.z - fit.depth).applyQuaternion(qS).multiplyScalar(s);
    rig.position.set(fp[0].f(n.x, dt), fp[1].f(n.y, dt), fp[2].f(n.z, dt)).sub(off);
    rig.quaternion.copy(qS);
    rig.scale.setScalar(s);
  }

  // ---------- face tracking ----------
  let landmarker = null;
  async function loadTracker() {
    const files = await FilesetResolver.forVisionTasks(WASM);
    const opts = d => ({ baseOptions: { modelAssetPath: MODEL, delegate: d }, runningMode: 'VIDEO', numFaces: 1, outputFacialTransformationMatrixes: true });
    try { return await FaceLandmarker.createFromOptions(files, opts('GPU')); }
    catch { return await FaceLandmarker.createFromOptions(files, opts('CPU')); }
  }
  const trackerReady = loadTracker().then(l => (landmarker = l));

  let lastVT = -1, lastT = performance.now(), lostAt = 0;
  function loop() {
    const now = performance.now();
    if (landmarker && video.readyState >= 2 && video.currentTime !== lastVT) {
      lastVT = video.currentTime;
      const dt = Math.max(1 / 120, (now - lastT) / 1000); lastT = now;
      const res = landmarker.detectForVideo(video, now);
      const L = res.faceLandmarks && res.faceLandmarks[0];
      if (L) { place(res, L, dt); rig.visible = true; lostAt = 0; say(''); }
      else {
        if (!lostAt) lostAt = now;
        if (now - lostAt > 250) { rig.visible = false; haveQ = false; fp.forEach(f => f.reset()); fs.reset(); say('Look at the camera'); }
      }
    }
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  // ---------- start ----------
  $('start').addEventListener('click', async () => {
    $('err').textContent = '';
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } } });
      video.srcObject = stream; await video.play();
      sizeTo(video.videoWidth, video.videoHeight);
      $('intro').hidden = true;
      if (!landmarker) say('Loading face tracking…');
      await trackerReady; say('Look at the camera');
      requestAnimationFrame(loop);
    } catch (e) {
      $('err').textContent = e && e.name === 'NotAllowedError'
        ? 'Camera access was blocked. Allow the camera for this site in your browser settings, then try again.'
        : 'The camera could not start here. If you opened this from Instagram, use “Open in browser” and try again.';
    }
  });

  // ---------- photo ----------
  let shotURL = null, shotBlob = null;
  $('snap').addEventListener('click', () => {
    if (!W) return;
    const out = document.createElement('canvas'); out.width = W; out.height = H;
    const g = out.getContext('2d');
    g.save(); g.translate(W, 0); g.scale(-1, 1); g.drawImage(video, 0, 0, W, H); g.restore();
    renderer.render(scene, camera); g.drawImage(canvas, 0, 0);
    g.font = `700 ${Math.round(H * 0.035)}px "Times New Roman", Georgia, serif`; g.fillStyle = '#fff'; g.textAlign = 'right';
    g.fillText('TCM', W - H * 0.03, H - H * 0.03);
    out.toBlob(bl => {
      shotBlob = bl; if (shotURL) URL.revokeObjectURL(shotURL);
      shotURL = URL.createObjectURL(bl); $('shotImg').src = shotURL; $('save').href = shotURL; $('shot').hidden = false;
    }, 'image/jpeg', 0.92);
  });
  $('close').addEventListener('click', () => { $('shot').hidden = true; });
  $('share').addEventListener('click', async () => {
    const file = shotBlob && new File([shotBlob], 'tcm-cordovan-tryon.jpg', { type: 'image/jpeg' });
    try {
      if (file && navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title: 'TCM Cordovan' });
      else $('save').click();
    } catch {}
  });
}
</script>
</body>
</html>
